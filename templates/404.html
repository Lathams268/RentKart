{% extends "base.html" %}
{% block title %}404 Not Found – RentKart{% endblock %}

{% block content %}
<div class="card max-w-md mx-auto text-center py-10 px-4 space-y-4 my-8">
  <div class="text-5xl">🧭</div>
  <h1 class="text-2xl font-extrabold text-gray-800">404 &mdash; Page Not Found</h1>
  <p class="text-sm text-gray-600">The page you are looking for doesn't exist, has been removed, or moved.</p>
  <div class="pt-2">
    <a href="{{ url_for('main.index') }}"
       class="inline-flex items-center justify-center min-h-[44px] px-6 py-2.5 bg-primary hover:bg-green-700 text-white font-bold rounded-xl shadow transition text-sm">
      🏡 {{ t('Go Home') }}
    </a>
  </div>
</div>
{% endblock %}
